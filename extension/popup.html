<!doctype html>
<meta charset="utf-8">
<title>클로이영어 — 클래스카드</title>
<style>
  :root { color-scheme: light; --ink:#1c2430; --dim:#5c6b7f; --line:#dfe5ec; --bg:#fff; --soft:#f5f7fa; --pri:#2563eb; --ok:#0f7b4f; --miss:#c0392b; }
  body { width: 320px; margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
         font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); font: inherit; cursor: pointer; }
  button.pri { background: var(--pri); border-color: var(--pri); color: #fff; }
  button[disabled] { opacity: .55; cursor: default; }
  .note { font-size: 12px; color: var(--dim); margin: 8px 0 0; }
  .ok { color: var(--ok); } .bad { color: var(--miss); }
  .box { margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); font-size: 12px; }
  .box b { font-weight: 600; }
  ul { margin: 4px 0 0; padding-left: 18px; }
</style>
<h1>🃏 클래스카드 → 클로이영어</h1>
<p class="note">이 크롬에 <b>로그인된 클래스카드</b>로 읽습니다. 비밀번호는 저장하지 않습니다.</p>
<label for="appUrl">앱 주소</label>
<input id="appUrl" type="url" autocomplete="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" data-form-type="other">
<label for="token">확장 열쇠 <span class="note">— 앱 설정 🔌 연동 열쇠의 🃏 줄</span></label>
<input id="token" type="text" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"
       data-lpignore="true" data-1p-ignore="true" data-form-type="other" style="-webkit-text-security: disc">
<div class="row">
  <button id="save">저장</button>
  <button id="run" class="pri">지금 보내기</button>
</div>
<p class="note" id="msg"></p>
<div class="box" id="state">아직 보낸 적이 없습니다.</div>
<script src="popup.js"></script>
